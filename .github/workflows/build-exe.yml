name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - main.py
      - requirements.txt
      - .github/workflows/build-exe.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name "OPTIMIZE WIN 10" main.py
      - uses: actions/upload-artifact@v4
        with:
          name: OPTIMIZE-WIN-10-EXE
          path: dist/OPTIMIZE WIN 10.exe
          if-no-files-found: error
      - name: Publish EXE to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: OPTIMIZE WIN 10 build ${{ github.run_number }}
          files: dist/OPTIMIZE WIN 10.exe
          generate_release_notes: true

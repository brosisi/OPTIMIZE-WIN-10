<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OPTIMIZE WIN 10 — Feather Logo Concepts</title>
<style>
:root{color-scheme:dark;--bg:#090b10;--panel:#111722;--line:#263244;--ink:#f4f7fb;--muted:#9aa8ba}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Segoe UI,Tahoma,sans-serif;padding:28px}
header{max-width:1100px;margin:0 auto 24px}h1{font-size:22px;margin:0 0 8px}p{margin:0;color:var(--muted);font-size:14px}
.grid{max-width:1100px;margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:14px}
.card{background:linear-gradient(145deg,#151d2a,#0d121b);border:1px solid var(--line);border-radius:16px;min-height:170px;display:grid;place-items:center;position:relative;padding:18px;transition:.18s}
.card:hover{border-color:#6da8ff;transform:translateY(-2px)}
.card svg{width:112px;height:112px;overflow:visible}
.num{position:absolute;top:10px;left:12px;color:#8392a7;font-size:11px;letter-spacing:1px}
.feather{stroke:var(--c,#e9f0f8);stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.fill{fill:var(--c,#e9f0f8)}.accent{stroke:var(--a,#42a5ff);fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:520px){body{padding:16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
